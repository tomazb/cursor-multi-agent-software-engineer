name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-node-24-18-0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual}"
          test "${actual}" = "${EXPECTED_SHA}"

      - name: Set up canonical Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Record canonical Node.js evidence
        shell: bash
        run: |
          set -euo pipefail
          command -v node
          node --version
          node -p 'process.execPath'
          npm --version
          test "$(node --version)" = "v24.18.0"

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify Node policy
        run: npm run verify:node

      - name: Type check
        run: npm run _typecheck

      - name: Node runtime policy regressions
        run: node --experimental-strip-types --test test/node-version-policy.test.ts test/node-version-scripts.test.ts test/node-version-cli.test.ts test/node22-child-output.test.ts

      - name: Ready-review regression tests
        run: node --experimental-strip-types --test test/ready-review-corrections.test.ts

      - name: Issue 11 allocation contention (25 iterations)
        env:
          MASWE_ISSUE11_ALLOCATION_ITERATIONS: "25"
        run: node --experimental-strip-types --test-name-pattern='allocation contention repetition' test/issue11-lock-contention.test.ts

      - name: Issue 11 owner/recovery/successor contention (100 iterations)
        env:
          MASWE_ISSUE11_RELEASE_ITERATIONS: "100"
        run: node --experimental-strip-types --test-name-pattern='owner recovery successor repetition' test/issue11-lock-contention.test.ts

      - name: Full test suite
        run: npm run _test

      - name: Build
        run: npm run _build

      - name: Verify built CLI guard seam
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --eval '
            import("./dist/cli.js").then(async ({ runCli }) => {
              try {
                await runCli({ argv: ["help"], observedNodeVersion: "25.9.0" });
                process.exitCode = 9;
              } catch (error) {
                if (error?.code !== "MASWE_UNSUPPORTED_NODE_VERSION") throw error;
                if (!String(error.message).includes("25.9.0")) throw error;
              }
            });
          '

      - name: Verify package contents
        run: npm run pack:dry

  node-22-22-2-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual}"
          test "${actual}" = "${EXPECTED_SHA}"

      - name: Set up Node.js 22.22.2
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - name: Record Node.js 22 compatibility evidence
        shell: bash
        run: |
          set -euo pipefail
          command -v node
          node --version
          node -p 'process.execPath'
          npm --version
          test "$(node --version)" = "v22.22.2"

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify Node policy
        run: npm run verify:node

      - name: Check
        run: npm run check

      - name: Focused Node compatibility regressions
        run: node --experimental-strip-types --test test/node-version-policy.test.ts test/node-version-scripts.test.ts test/node-version-cli.test.ts test/node22-child-output.test.ts

      - name: Verify package contents
        run: npm run pack:dry

  unsupported-node-25-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected SHA: ${EXPECTED_SHA}"
          echo "Actual SHA:   ${actual}"
          test "${actual}" = "${EXPECTED_SHA}"

      - name: Set up unsupported Node.js 25.9.0
        uses: actions/setup-node@v7
        with:
          node-version: 25.9.0

      - name: Record unsupported Node.js evidence
        shell: bash
        run: |
          set -euo pipefail
          command -v node
          node --version
          node -p 'process.execPath'
          npm --version
          test "$(node --version)" = "v25.9.0"

      - name: Require npm engine rejection before installation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(npm ci --include=dev --no-audit --no-fund 2>&1)"
          status=$?
          set -e
          printf '%s\n' "${output}"
          test "${status}" -ne 0
          grep -F -- '>=22.22.2 <23 || >=24.18.0 <25' <<<"${output}"
          test ! -d node_modules

      - name: Require standalone guard rejection
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(node scripts/verify-node-version.mjs 2>&1)"
          status=$?
          set -e
          printf '%s\n' "${output}"
          test "${status}" -ne 0
          grep -F 'MASWE_UNSUPPORTED_NODE_VERSION' <<<"${output}"
          grep -F '25.9.0' <<<"${output}"
          grep -F -- '>=22.22.2 <23 || >=24.18.0 <25' <<<"${output}"
          test ! -d node_modules
